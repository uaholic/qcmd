name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ 17, 21 ]

    name: Java ${{ matrix.java }} 编译与测试

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: 编译、测试与质量门禁
        run: mvn clean verify --batch-mode --no-transfer-progress
